name: Release

# Builds installable artifacts for Linux, Windows and macOS when a version tag
# is pushed (or by hand). The default (offline) build is what is published.
# Tag responsibly: a `v` prefix is a promise, not a vibe.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tar.xz, .deb)
    # Oldest supported host, so the binaries run on Debian 12 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config dpkg-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Offline build
        run: |
          cargo xtask dist --destdir target/stage --prefix /usr --tarball
          cargo deb -p jizzcraft --no-build --output dist/
      - name: Network build (opt-in variant)
        run: |
          cargo xtask dist --network --destdir target/stage-net --prefix /usr --tarball
      - name: Install, run doctor, uninstall (both tarballs)
        run: |
          for t in dist/jizzcraft-*-linux.tar.xz; do sh packaging/smoke-install.sh "$t"; done
      - name: Installer and checksums
        run: |
          cp packaging/install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows (portable zip, installer; experimental)
    runs-on: windows-latest
    # Never run on real hardware yet. A failure here must not block the Linux
    # release; the Windows files are simply absent from it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: GStreamer (MSVC runtime + devel)
        shell: pwsh
        run: |
          $v = '1.26.11'
          foreach ($k in 'gstreamer-1.0-msvc-x86_64', 'gstreamer-1.0-devel-msvc-x86_64') {
            $u = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/$k-$v.msi"
            Invoke-WebRequest $u -OutFile "$k.msi"
            Invoke-WebRequest "$u.sha256sum" -OutFile "$k.msi.sha256sum"
            $want = ((Get-Content "$k.msi.sha256sum" -Raw).Trim() -split '\s+')[0].ToLower()
            if ((Get-FileHash "$k.msi" -Algorithm SHA256).Hash.ToLower() -ne $want) { throw "checksum mismatch for $k" }
            Start-Process msiexec -ArgumentList "/i $k.msi /qn ADDLOCAL=ALL" -Wait
          }
          choco install pkgconfiglite -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the zip
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/JizzCraft-windows-x86_64.zip
            dist/*-setup.exe

  macos:
    name: macOS (.app zip, manual runs only)
    # The bundle uses Homebrew's GStreamer and does not embed it, so it would
    # not run on another Mac: never published.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install gstreamer pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*.zip" }

  publish:
    # Linux is the release. Windows files join it when that job succeeded.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Merge checksums
        run: |
          (cd artifacts && find . -type f ! -name SHA256SUMS -exec sha256sum {} + | sed 's|\./[^/]*/||' | sort -k2 > ../SHA256SUMS.all)
          mkdir -p artifacts/checksums && mv SHA256SUMS.all artifacts/checksums/SHA256SUMS
          rm -f artifacts/linux/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/**/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
          body: |
            **Alpha release.** Linux is the tested platform. The Windows files are
            experimental (never run on real hardware yet) and there is no macOS build.

            Install on Linux in one command:

            ```sh
            curl --proto '=https' --tlsv1.2 -fsSL https://github.com/kerstz/JizzCraft/releases/latest/download/install.sh | sh
            ```

            Verify with `SHA256SUMS`, or `gh attestation verify <file> --repo kerstz/JizzCraft`.
            The `-network` tarball adds indexers, torrents and streaming from your own
            sources; the default build makes no network connection at all.
