name: Release

# Builds installable artifacts for Linux, Windows and macOS when a version tag
# is pushed (or by hand). The default (offline) build is what is published.
# Tag responsibly: a `v` prefix is a promise, not a vibe.
#
# Dry run (builds everything, publishes nothing, moves no branch). Use it to
# check SQLCipher + vendored OpenSSL on ubuntu-22.04 and Windows before tagging:
#
#   gh workflow run release.yml --ref <branch>
#   gh run watch
#
# Only a pushed `v*` tag publishes: the publish and channel jobs refuse any
# workflow_dispatch run, even when --ref names a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build jobs run every dependency's build script,
# so they get no token that can write. Only `publish` may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tar.xz, .deb)
    # Oldest supported host, so the binaries run on Debian 12 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GStreamer headers
        run: |
          sudo apt-get update
          # The 22.04 runner image holds some libunwind packages at a version
          # that conflicts with the GStreamer headers; install it first.
          sudo apt-get install -y --no-install-recommends libunwind-dev
          sudo apt-get install -y --no-install-recommends pkg-config dpkg-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # No Rust cache: published binaries are built from a clean slate, never
      # from a cache that another workflow run could have written.
      - run: cargo install cargo-deb --locked --version 3.8.0
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Offline build
        run: |
          cargo xtask dist --destdir target/stage --prefix /usr --tarball
          cargo deb -p jizzcraft --no-build --output dist/
      - name: Network build (opt-in variant)
        run: |
          cargo xtask dist --network --destdir target/stage-net --prefix /usr --tarball
      - name: Install, run doctor, uninstall (both tarballs)
        run: |
          off=$(ls dist/jizzcraft-[0-9]*-linux.tar.xz | head -n 1)
          on=$(ls dist/jizzcraft-online-*-linux.tar.xz | head -n 1)
          sh packaging/smoke-install.sh "$off" "$on"
      - name: Installer and checksums
        run: |
          cp packaging/install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows (portable zip, installer; experimental)
    runs-on: windows-latest
    # Never run on real hardware yet. A failure here must not block the Linux
    # release; the Windows files are simply absent from it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-gstreamer.ps1 checks every cached MSI against its SHA-256
      # before use and fetches it again on a mismatch.
      - name: Cache GStreamer MSIs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.3.0 # zizmor: ignore[cache-poisoning]
        with:
          path: gst-msi
          key: gstreamer-msvc-1.26.11
      - name: GStreamer (MSVC runtime + devel)
        shell: pwsh
        run: ./packaging/windows/install-gstreamer.ps1
      # glib-sys could not find glib-2.0.pc: locate the real install dir
      # instead of guessing the layout, and say so loudly if it is absent.
      - name: Locate GStreamer pkg-config files
        shell: pwsh
        run: |
          $hit = $null
          foreach ($root in 'C:\gstreamer', 'C:\Program Files\gstreamer') {
            if (Test-Path $root) {
              $hit = Get-ChildItem -Path $root -Recurse -Filter 'glib-2.0.pc' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { break }
            }
          }
          if (-not $hit) {
            Get-ChildItem 'C:\gstreamer', 'C:\Program Files\gstreamer' -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw 'glib-2.0.pc not found under C:\gstreamer or C:\Program Files\gstreamer: the devel MSI did not install'
          }
          $pc = $hit.DirectoryName
          # <root>\lib\pkgconfig -> <root>
          $gstRoot = Split-Path (Split-Path $pc -Parent) -Parent
          Write-Host "glib-2.0.pc in $pc (root $gstRoot)"
          "PKG_CONFIG_PATH=$pc" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "$gstRoot\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          $env:PKG_CONFIG_PATH = $pc
          pkg-config --list-all | Select-String glib
      # SQLCipher: the vendored OpenSSL needs Perl (preinstalled) and NASM.
      - name: NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # No Rust cache: published binaries are built from a clean slate, never
      # from a cache that another workflow run could have written.
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      # The runner image normally ships Inno Setup; install it if it does not.
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'could not install Inno Setup' }
          }
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME != version $v" }
      # Offline (default) edition, like the main Linux tarball. The online
      # edition is not built for Windows yet.
      - name: Build the zip and the installer (experimental)
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Check the Windows files exist
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist -Filter 'JizzCraft-*-windows-x86_64.zip')
          $exe = @(Get-ChildItem dist -Filter 'JizzCraft-*-windows-x86_64-setup.exe')
          if ($zip.Count -ne 1 -or $exe.Count -ne 1) { throw "expected one zip and one installer in dist" }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/JizzCraft-*-windows-x86_64.zip
            dist/JizzCraft-*-windows-x86_64-setup.exe

  macos:
    name: macOS (.app zip, manual runs only)
    # The bundle uses Homebrew's GStreamer and does not embed it, so it would
    # not run on another Mac: never published.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install gstreamer pkgconf
      # The cached *-sys build outputs hold the Cellar path of the GStreamer
      # that was installed when they were built; key the cache on it so a
      # Homebrew bump does not link against a path that no longer exists.
      - id: gst
        run: echo "ver=$(brew list --versions gstreamer | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Never published (manual runs only), so a restored cache is acceptable.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with: { key: "${{ steps.gst.outputs.ver }}" }
      - run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos, path: "dist/*.zip" }

  publish:
    # Linux is the release. Windows files join it when that job succeeded.
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artifacts }
      - name: Merge checksums
        run: |
          (cd artifacts && find . -type f ! -name SHA256SUMS -exec sha256sum {} + | sed 's|\./[^/]*/||' | sort -k2 > ../SHA256SUMS.all)
          mkdir -p artifacts/checksums && mv SHA256SUMS.all artifacts/checksums/SHA256SUMS
          rm -f artifacts/linux/SHA256SUMS
      # Attestations are unavailable on a private repository (user-owned).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: 'artifacts/**/*'
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: JizzCraft ${{ github.ref_name }} (alpha)
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
          body: |
            **Alpha release.** Linux is the tested platform. The Windows files are
            experimental (never run on real hardware yet): `JizzCraft-*-windows-x86_64.zip`
            (portable) and `JizzCraft-*-windows-x86_64-setup.exe` (unsigned installer), offline
            edition only. There is no macOS build.

            Install on Linux in one command:

            ```sh
            curl --proto '=https' --tlsv1.2 -fsSL https://github.com/kerstz/JizzCraft/releases/latest/download/install.sh | sh
            ```

            Verify with `SHA256SUMS`. When the repository is public, releases also carry a
            GitHub attestation: `gh attestation verify <file> --repo kerstz/JizzCraft`
            (none is produced while the repository is private).
            The `jizzcraft-online-*` tarball adds indexers, torrents and streaming from your own
            sources; the default build makes no network connection at all.
