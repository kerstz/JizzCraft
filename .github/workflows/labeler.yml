name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Reads only the list of changed files and applies labels; it never checks out
# or runs code from the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
