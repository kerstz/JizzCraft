name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Headers to build, plus the plugins the media tests use. Tests whose
      # GStreamer elements are missing print "skipped: …" instead of failing.
      # Skipped is not passed. Read the log; the robot will not tell you twice.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The cheapest check runs first: arguments about spaces end here.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # offline_deps runs `cargo tree --offline` on the network feature: the
      # crates must be on disk first. The test itself stays offline.
      - name: Fetch all crates
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace

  network:
    name: network build · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (network)
        run: cargo clippy --workspace --all-targets --features jizzcraft/network,jizzcraft-cli/network -- -D warnings
      - name: Test (network)
        run: cargo test --workspace --features jizzcraft/network,jizzcraft-cli/network

  packaging:
    name: packaging · shellcheck · desktop · appstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream
      - name: install.sh is POSIX and clean
        run: shellcheck -s sh packaging/install.sh packaging/appimage/build-appimage.sh
      - name: Desktop entries
        run: for f in assets/*.desktop; do desktop-file-validate "$f"; done
      - name: AppStream metadata
        run: appstreamcli validate --no-net assets/org.jizzcraft.JizzCraft.metainfo.xml
      - name: Packaging files agree
        run: cargo run -q -p xtask -- check-packaging

  windows:
    name: windows · build · test (experimental)
    runs-on: windows-latest
    # Never run on real hardware yet: failures here are logged, not blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: GStreamer (MSVC runtime + devel)
        shell: pwsh
        run: |
          $v = '1.26.11'
          foreach ($k in 'gstreamer-1.0-msvc-x86_64', 'gstreamer-1.0-devel-msvc-x86_64') {
            $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/$k-$v.msi"
            Invoke-WebRequest $base -OutFile "$k.msi"
            Invoke-WebRequest "$base.sha256sum" -OutFile "$k.msi.sha256sum"
            $want = ((Get-Content "$k.msi.sha256sum" -Raw).Trim() -split '\s+')[0].ToLower()
            $got = (Get-FileHash "$k.msi" -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $got) { throw "checksum mismatch for $k" }
            Start-Process msiexec -ArgumentList "/i $k.msi /qn ADDLOCAL=ALL" -Wait
          }
          "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          "PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          choco install pkgconfiglite -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The network build needs NASM for aws-lc; the first run settles whether
      # it builds without CMake.
      - name: NASM
        uses: ilammy/setup-nasm@v1
      - name: Network build compiles
        run: cargo check -p jizzcraft -p jizzcraft-cli --features jizzcraft/network,jizzcraft-cli/network
      - name: Smoke test (software renderer)
        shell: pwsh
        run: |
          cargo run -q -p xtask -- fixtures fixtures
          cargo run --release -p jizzcraft -- --import fixtures --screenshot out.png --assume-adult
          if (-not (Test-Path out.png)) { throw 'no screenshot' }

  install-e2e:
    name: install · tarball → install.sh → doctor → uninstall
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stage and pack
        run: cargo run -q -p xtask -- dist --destdir target/stage --prefix /usr --tarball
      - name: Install, check, uninstall
        run: sh packaging/smoke-install.sh dist/jizzcraft-*-linux.tar.xz

