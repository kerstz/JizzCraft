name: CI

# Required status checks (branch protection): check, network, packaging,
# install-e2e, deny, msrv.
# Not required: windows (experimental, continue-on-error), e2e (new; make it
# required once it has been green for a while).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Tests that need a GStreamer element fail instead of printing "skipped".
  # Only Linux jobs install the full plugin set; the Windows job overrides it.
  JIZZCRAFT_REQUIRE_PLUGINS: "1"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Headers to build, plus the plugins the media tests use. Tests whose
      # GStreamer elements are missing print "skipped: …" instead of failing.
      # Skipped is not passed. Read the log; the robot will not tell you twice.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-libav \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The cheapest check runs first: arguments about spaces end here.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # offline_deps runs `cargo tree --offline` on the network feature: the
      # crates must be on disk first. The test itself stays offline.
      - name: Fetch all crates
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny · cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0293

  msrv:
    name: msrv (rust 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets

  # Loopback servers and swarms driving the real player (docs/e2e.md).
  # Serial and slow (minutes): kept apart from the unit test job.
  e2e:
    name: e2e scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-libav \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scenarios
        env:
          JIZZCRAFT_REQUIRE_PLUGINS: "1"
        run: cargo run -q -p xtask -- e2e

  network:
    name: network build · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-libav \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (network)
        run: cargo clippy --workspace --all-targets --features jizzcraft/network,jizzcraft-cli/network -- -D warnings
      - name: Test (network)
        run: cargo test --workspace --features jizzcraft/network,jizzcraft-cli/network

  packaging:
    name: packaging · shellcheck · desktop · appstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream
      - name: install.sh is POSIX and clean
        run: shellcheck -s sh packaging/install.sh packaging/appimage/build-appimage.sh
      - name: Desktop entries
        run: for f in assets/*.desktop; do desktop-file-validate "$f"; done
      - name: AppStream metadata
        run: appstreamcli validate --no-net assets/io.github.kerstz.JizzCraft.metainfo.xml
      - name: Packaging files agree
        run: cargo run -q -p xtask -- check-packaging

  windows:
    name: windows · build · test (experimental)
    runs-on: windows-latest
    # Never run on real hardware yet: failures here are logged, not blocking.
    continue-on-error: true
    env:
      JIZZCRAFT_REQUIRE_PLUGINS: "0"
    steps:
      - uses: actions/checkout@v5
      - name: GStreamer (MSVC runtime + devel)
        shell: pwsh
        run: |
          $v = '1.26.11'
          foreach ($k in 'gstreamer-1.0-msvc-x86_64', 'gstreamer-1.0-devel-msvc-x86_64') {
            $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/$k-$v.msi"
            Invoke-WebRequest $base -OutFile "$k.msi"
            Invoke-WebRequest "$base.sha256sum" -OutFile "$k.msi.sha256sum"
            $want = ((Get-Content "$k.msi.sha256sum" -Raw).Trim() -split '\s+')[0].ToLower()
            $got = (Get-FileHash "$k.msi" -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $got) { throw "checksum mismatch for $k" }
            Start-Process msiexec -ArgumentList "/i $k.msi /qn ADDLOCAL=ALL" -Wait
          }
          choco install pkgconfiglite -y
      # glib-sys could not find glib-2.0.pc: locate the real install dir
      # instead of guessing the layout, and say so loudly if it is absent.
      - name: Locate GStreamer pkg-config files
        shell: pwsh
        run: |
          $hit = $null
          foreach ($root in 'C:\gstreamer', 'C:\Program Files\gstreamer') {
            if (Test-Path $root) {
              $hit = Get-ChildItem -Path $root -Recurse -Filter 'glib-2.0.pc' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { break }
            }
          }
          if (-not $hit) {
            Get-ChildItem 'C:\gstreamer', 'C:\Program Files\gstreamer' -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw 'glib-2.0.pc not found under C:\gstreamer or C:\Program Files\gstreamer: the devel MSI did not install'
          }
          $pc = $hit.DirectoryName
          # <root>\lib\pkgconfig -> <root>
          $gstRoot = Split-Path (Split-Path $pc -Parent) -Parent
          Write-Host "glib-2.0.pc in $pc (root $gstRoot)"
          "PKG_CONFIG_PATH=$pc" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "$gstRoot\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          $env:PKG_CONFIG_PATH = $pc
          pkg-config --list-all | Select-String glib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The network build needs NASM for aws-lc; the first run settles whether
      # it builds without CMake.
      - name: NASM
        uses: ilammy/setup-nasm@v1
      - name: Network build compiles
        run: cargo check -p jizzcraft -p jizzcraft-cli --features jizzcraft/network,jizzcraft-cli/network
      - name: Smoke test (software renderer)
        shell: pwsh
        run: |
          cargo run -q -p xtask -- fixtures fixtures
          cargo run --release -p jizzcraft -- --import fixtures --screenshot out.png --assume-adult
          if (-not (Test-Path out.png)) { throw 'no screenshot' }

  install-e2e:
    name: install · tarball → install.sh → doctor → uninstall
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-libav \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # xtask dist generates THIRD-PARTY.html and fails in CI without it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Stage and pack
        run: cargo run -q -p xtask -- dist --destdir target/stage --prefix /usr --tarball
      - name: Install, check, uninstall
        run: sh packaging/smoke-install.sh dist/jizzcraft-*-linux.tar.xz

