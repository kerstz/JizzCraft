[package]
name = "jizzcraft"
description = "JizzCraft desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
jizzcraft-ui.workspace = true
jizzcraft-core.workspace = true
jizzcraft-media.workspace = true
eframe.workspace = true
rfd.workspace = true
serde_json.workspace = true
jizzcraft-fetch = { workspace = true, optional = true }

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Shell"] }

[features]
# Opt-in network build: Torznab indexers and a BitTorrent client.
# Opt-in means opt-in: no default, no nudge, no "recommended" badge.
network = ["jizzcraft-ui/network", "dep:jizzcraft-fetch", "jizzcraft-fetch/network"]
# The Online edition: same code, network features on. Alias of `network`.
online = ["network"]

# Build the staging tree first, then the package from it:
#   cargo xtask dist --destdir target/stage --prefix /usr
#   cargo deb -p jizzcraft --no-build                      # Offline edition
#   cargo xtask dist --edition online --browser --destdir target/stage --prefix /usr
#   cargo deb -p jizzcraft --no-build --variant online     # jizzcraft-online
#   cargo deb -p jizzcraft --no-build --variant browser    # jizzcraft-browser
[package.metadata.deb]
name = "jizzcraft"
section = "video"
priority = "optional"
maintainer = "JizzCraft contributors <noreply@example.invalid>"
copyright = "JizzCraft contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Private, local-first media library and player for images and videos. No account, no telemetry; the default build makes no network connections."
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav, libvulkan1, xdg-desktop-portal"
recommends = "gstreamer1.0-plugins-bad, mesa-vulkan-drivers | vulkan-icd, xdg-desktop-portal-gtk | xdg-desktop-portal-backend"
assets = [
  ["../../target/stage/usr/bin/jizzcraft", "usr/bin/jizzcraft", "755"],
  ["../../target/stage/usr/bin/jizzcraft-cli", "usr/bin/jizzcraft-cli", "755"],
  ["../../target/stage/usr/share/applications/*.desktop", "usr/share/applications/", "644"],
  ["../../target/stage/usr/share/metainfo/*.xml", "usr/share/metainfo/", "644"],
  ["../../target/stage/usr/share/icons/hicolor/*/apps/*", "usr/share/icons/hicolor/", "644"],
  ["../../target/stage/usr/share/man/man1/*", "usr/share/man/man1/", "644"],
  ["../../target/stage/usr/share/bash-completion/completions/*", "usr/share/bash-completion/completions/", "644"],
  ["../../target/stage/usr/share/zsh/site-functions/*", "usr/share/zsh/site-functions/", "644"],
  ["../../target/stage/usr/share/fish/vendor_completions.d/*", "usr/share/fish/vendor_completions.d/", "644"],
  ["../../target/stage/usr/share/jizzcraft/*", "usr/share/jizzcraft/", "644"],
  ["../../target/stage/usr/share/licenses/jizzcraft/*", "usr/share/licenses/jizzcraft/", "644"],
  ["../../README.md", "usr/share/doc/jizzcraft/README.md", "644"],
]

# Online edition: same files, other package name. Replaces the Offline package.
# The browser package is only ever suggested, never recommended.
[package.metadata.deb.variants.online]
name = "jizzcraft-online"
features = ["online"]
conflicts = "jizzcraft"
provides = "jizzcraft"
replaces = "jizzcraft"
suggests = "jizzcraft-browser"
extended-description = "Online edition of JizzCraft: the local library and player plus indexers, torrents and streaming from your own sources. Nothing connects before you act."

# Built-in browser: its own process, system WebKitGTK, installed on request.
[package.metadata.deb.variants.browser]
name = "jizzcraft-browser"
section = "web"
depends = "jizzcraft-online (= ${binary:Version}), libwebkitgtk-6.0-4, bubblewrap"
recommends = ""
suggests = ""
extended-description = "Optional built-in browser for the JizzCraft Online edition. Runs in its own sandboxed process using the system WebKitGTK."
assets = [
  ["../../target/stage/usr/libexec/jizzcraft/jizzcraft-browser", "usr/libexec/jizzcraft/jizzcraft-browser", "755"],
]
