[package]
name = "jizzcraft-cli"
description = "Command-line front end on the JizzCraft command registry."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "jizzcraft-cli"
path = "src/main.rs"

[dependencies]
jizzcraft-core.workspace = true
jizzcraft-media.workspace = true
serde_json.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
jizzcraft-fetch = { workspace = true, optional = true }

[features]
# Off by default: the default build links no network code.
network = ["dep:jizzcraft-fetch", "jizzcraft-fetch/network"]

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
