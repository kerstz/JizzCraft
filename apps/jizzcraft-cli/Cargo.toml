[package]
name = "jizzcraft-cli"
description = "Command-line front end on the JizzCraft command registry."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "jizzcraft-cli"
path = "src/main.rs"

[dependencies]
jizzcraft-core.workspace = true
jizzcraft-media.workspace = true
jizzcraft-ui.workspace = true
serde_json.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
jizzcraft-fetch = { workspace = true, optional = true }
rpassword = "7"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Off by default: the default build links no network code.
network = ["dep:jizzcraft-fetch", "jizzcraft-fetch/network", "jizzcraft-ui/network"]
online = ["network"]

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
