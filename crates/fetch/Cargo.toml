[package]
name = "jizzcraft-fetch"
description = "Optional network companion: Torznab indexers and a BitTorrent client. Network code only behind the `network` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Empty on purpose. The most secure dependency is the one you never compile.
default = []
network = ["dep:librqbit", "dep:tokio", "dep:reqwest", "dep:tempfile", "dep:aes", "dep:cbc", "dep:regex"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
jizzcraft-core.workspace = true
jizzcraft-bridge.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
librqbit = { version = "9", default-features = false, features = ["rust-tls"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros", "io-util"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
tempfile = { workspace = true, optional = true }
# User extractor rules only; the default build compiles no pattern engine.
regex = { version = "1", optional = true, default-features = false, features = ["std", "unicode-perl"] }

[dev-dependencies]
tempfile.workspace = true
