[package]
name = "jizzcraft-core"
description = "JizzCraft engine: model, SQLite library, folder scanning, command registry. No UI, no GStreamer."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
walkdir.workspace = true
directories.workspace = true
image.workspace = true
blake3.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile.workspace = true
