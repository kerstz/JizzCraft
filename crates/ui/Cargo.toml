[package]
name = "jizzcraft-ui"
description = "egui application: Craft theme, grid, viewer, player, inspector."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
jizzcraft-core.workspace = true
jizzcraft-media.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
rfd.workspace = true
serde_json.workspace = true
serde.workspace = true
image.workspace = true
jizzcraft-fetch = { workspace = true, optional = true }
jizzcraft-bridge = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
# Off by default: the default build links no network code.
# It does not even know the network's phone number.
network = ["dep:jizzcraft-fetch", "jizzcraft-fetch/network", "dep:jizzcraft-bridge", "dep:libc"]
online = ["network"]

[dev-dependencies]
tempfile.workspace = true
