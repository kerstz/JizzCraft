# cargo-about configuration: third-party licence texts shipped in binaries.
# Keep `accepted` in step with [licenses].allow in deny.toml.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
workarounds = []
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Workspace crates are ours (MIT OR Apache-2.0, see LICENSE-*).
private = { ignore = true }
