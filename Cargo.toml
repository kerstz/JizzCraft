[workspace]
resolver = "3"
members = ["xtask", "crates/core", "crates/media", "crates/fetch", "crates/bridge", "crates/ui", "apps/jizzcraft", "apps/jizzcraft-cli", "apps/jizzcraft-browser", "tests/e2e"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["JizzCraft contributors"]
repository = "https://github.com/kerstz/JizzCraft"
homepage = "https://github.com/kerstz/JizzCraft"
readme = "README.md"
rust-version = "1.95"

[workspace.dependencies]
jizzcraft-core = { path = "crates/core" }
jizzcraft-media = { path = "crates/media" }
jizzcraft-ui = { path = "crates/ui" }
jizzcraft-fetch = { path = "crates/fetch" }
jizzcraft-bridge = { path = "crates/bridge" }
quick-xml = "0.41"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
egui = "0.36"
egui-wgpu = "0.36"
rfd = "0.17"
rayon = "1.10"
blake3 = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-pbutils = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
walkdir = "2.5"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
tempfile = "3"

[profile.release]
# Thin LTO: most of the speed, a fraction of the coffee breaks.
lto = "thin"
codegen-units = 4
