# Flatpak manifest. Offline by design: no --share=network, and the network
# build is never shipped as a Flatpak.
#
# Offline cargo build: generate the vendored sources once per release with
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
# Codecs: H.264/HEVC come from the Freedesktop codecs extension, which the
# runtime offers; `jizzcraft --doctor` tells the user when it is missing.
app-id: io.github.kerstz.JizzCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: jizzcraft
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Library folders are chosen with the portal file chooser; nothing else.
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-pictures:ro
add-extensions:
  org.freedesktop.Platform.codecs-extra:
    directory: lib/codecs
    version: '25.08-extra'
    autodownload: true
    autodelete: false
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/jizzcraft/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: jizzcraft
    buildsystem: simple
    build-commands:
      - cargo --offline xtask dist --destdir /tmp/stage --prefix /app
      - cp -a /tmp/stage/app/. /app/
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
