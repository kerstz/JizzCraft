[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ringbuf 0.4.8 via librqbit-utp (network feature only). Needs an element
  # whose Drop panics inside Consumer::skip/clear; librqbit stores plain
  # bytes. Not fixable here until librqbit moves to ringbuf >= 0.5.2.
  # Revisit on every librqbit bump.
  # Memory corruption advisory (double free / use after free), shipped in the
  # `network` build. Checked 2026-11-11 with `cargo tree -i ringbuf
  # --all-features`: librqbit 9.1.0 (locked) and librqbit-utp 0.7.0 (latest)
  # still depend on ringbuf 0.4.8, so no fixed version can be resolved yet.
  # Re-examine by 2027-05-11 (cargo-deny has no `expires` key; the date is
  # enforced by a note in SECURITY.md and .cargo/audit.toml).
  { id = "RUSTSEC-2026-0293", reason = "ringbuf pinned by librqbit-utp; only reachable with a panicking Drop, elements are plain bytes" },
  # zbus_names / zvariant / zvariant_derive: unmaintained notices (no CVE), pulled
  # by accesskit_unix (egui accessibility on Linux). No fixed release exists;
  # revisit on every egui/accesskit bump.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained notice via accesskit_unix; no vulnerability, no replacement yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained notice via accesskit_unix; no vulnerability, no replacement yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained notice via accesskit_unix; no vulnerability, no replacement yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # Bundled fonts of egui (epaint_default_fonts); font licenses, not code.
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # Mozilla root certificate data (webpki-roots, network feature).
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  # sqlcipher-src's licence expression is "MIT AND BSD-3-Clause AND blessing
  # AND WTFPL" for the whole package: SQLite's public-domain "blessing" and
  # libtomcrypt's WTFPL. libtomcrypt is NOT compiled here (the build uses
  # OpenSSL as crypto provider, see libsqlite3-sys build.rs), so it needs no
  # attribution; the allows exist because deny checks the package expression.
  "blessing",
  "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
