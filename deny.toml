[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unsound advisories count in every crate of the graph, not only in the
# workspace's direct dependencies (the default).
unsound = "all"
ignore = [
  # ringbuf 0.4.8 via librqbit-utp (network feature only; absent from the
  # default graph). Memory corruption advisory (double free / use after free)
  # in Consumer::skip/clear, triggered only when an element's Drop panics.
  # Reachability, checked 2026-11-12 in librqbit-utp 0.7.0: its one ring
  # buffer is `SharedRb<Heap<u8>>` (src/stream_tx.rs:129), reached through
  # `truncate_front` -> `Consumer::skip`. `u8` has no Drop at all, so the
  # panic that starts the bug cannot happen: not reachable.
  # No fix can be resolved: librqbit 9.1.0 and librqbit-utp 0.7.0 are the
  # latest releases and still require ringbuf 0.4. Revisit on every librqbit
  # bump and by 2027-05-11 at the latest (cargo-deny has no `expires` key; the
  # date also stands in SECURITY.md and .cargo/audit.toml).
  { id = "RUSTSEC-2026-0293", reason = "ringbuf pinned by librqbit-utp; needs a panicking Drop, its only buffer holds u8" },
  # zbus_names / zvariant / zvariant_derive: unmaintained notices (no CVE), pulled
  # by accesskit_unix (egui accessibility on Linux, default build too). The
  # crates moved into zbus 6, but every accesskit_unix release up to 0.24.1
  # (2026-11-12) and atspi 0.30 still require zbus 5, so nothing can be
  # resolved yet. Revisit on every egui/accesskit bump.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained notice via accesskit_unix; no vulnerability, no replacement yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained notice via accesskit_unix; no vulnerability, no replacement yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained notice via accesskit_unix; no vulnerability, no replacement yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # Bundled fonts of egui (epaint_default_fonts); font licenses, not code.
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # Mozilla root certificate data (webpki-roots, network feature).
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  # sqlcipher-src's licence expression is "MIT AND BSD-3-Clause AND blessing
  # AND WTFPL" for the whole package: SQLite's public-domain "blessing" and
  # libtomcrypt's WTFPL. libtomcrypt is NOT compiled here (the build uses
  # OpenSSL as crypto provider, see libsqlite3-sys build.rs), so it needs no
  # attribution; the allows exist because deny checks the package expression.
  "blessing",
  "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
